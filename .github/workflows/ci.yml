name: Pipeline de Integración Continua (CI)

# 1. Cuándo se ejecuta
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# 2. Qué tareas ejecuta
jobs:
  verificacion-codigo:
    name: Compilación y Pruebas
    runs-on: ubuntu-latest

    # Definimos la matriz para probar en varias versiones de Node.js
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 1. Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Ejecutar Pruebas Automatizadas
        run: npm test